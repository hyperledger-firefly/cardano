
name: Run demo

on:
  pull_request:

jobs:
  demo:
    name: Run Demo
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Add wallet secret
        run: mkdir ./infra/wallet ; echo '${{ secrets.DEMO_WALLET }}' > ./infra/wallet/addr_test1vqhkukz0285zvk0xrwk9jlq0075tx6furuzcjvzpnhtgelsuhhqc4.skey
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build cardanoconnect image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          provenance: false
          target: firefly-cardanoconnect
          tags: ghcr.io/hyperledger-firefly/cardanoconnect:main
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
      - name: Build cardanosigner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          provenance: false
          target: firefly-cardanosigner
          tags: ghcr.io/hyperledger-firefly/cardanosigner:main
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
      - name: Start docker-compose
        run: docker compose -f ./infra/docker-compose.node.yaml -p preview up -d
      - name: Logs
        if: always()
        run: |
          docker compose -f ./infra/docker-compose.node.yaml -p preview logs
          docker ps -a
      - name: Run demo
        env:
          ADDR_FROM: addr_test1vqhkukz0285zvk0xrwk9jlq0075tx6furuzcjvzpnhtgelsuhhqc4
          ADDR_TO: addr_test1vqeux7xwusdju9dvsj8h7mca9aup2k439kfmwy773xxc2hcu7zy99
        run: make demo
