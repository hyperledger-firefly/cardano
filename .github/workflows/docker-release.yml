name: Docker Release Build

on:
  release:
    types: [released, prereleased]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run unit tests
        run: cargo test --verbose

  docker:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service-name: [cardanoconnect, cardanosigner]
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Docker login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set latest tag
        if: github.event.action == 'released'
        run: |
          echo "DOCKER_TAGS=${{ env.DOCKER_TAGS }},ghcr.io/${{ github.repository_owner }}/${{ matrix.service-name }}:latest" >> $GITHUB_ENV

      - name: Set alpha tag
        if: github.event.action == 'prereleased' && contains(github.ref, 'alpha')
        run: |
          echo "DOCKER_TAGS=${{ env.DOCKER_TAGS }},ghcr.io/${{ github.repository_owner }}/${{ matrix.service-name }}:alpha" >> $GITHUB_ENV

      - name: Set beta tag
        if: github.event.action == 'prereleased' && contains(github.ref, 'beta')
        run: |
          echo "DOCKER_TAGS=${{ env.DOCKER_TAGS }},ghcr.io/${{ github.repository_owner }}/${{ matrix.service-name }}:beta" >> $GITHUB_ENV

      - name: Set rc tag
        if: github.event.action == 'prereleased' && contains(github.ref, 'rc')
        run: |
          echo "DOCKER_TAGS=${{ env.DOCKER_TAGS }},ghcr.io/${{ github.repository_owner }}/${{ matrix.service-name }}:rc" >> $GITHUB_ENV

      - name: Set build tag
        id: build_tag_generator
        run: |
          RELEASE_TAG=$(curl https://api.github.com/repos/${{ github.repository }}/releases/latest -s | jq .tag_name -r)
          BUILD_TAG=$RELEASE_TAG-$(date +"%Y%m%d")-$GITHUB_RUN_NUMBER
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "BUILD_TAG=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service-name }}:${{ github.ref_name }},ghcr.io/${{ github.repository_owner }}/${{ matrix.service-name }}:head,${{ env.DOCKER_TAGS }}
          target: firefly-${{ matrix.service-name }}
          labels: |
            commit=${{ github.sha }}
            build_date=${{ steps.build_tag_generator.outputs.BUILD_DATE }}
            tag=${{ steps.build_tag_generator.outputs.RELEASE_TAG }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max
          build-args: |
            BUILD_VERSION=${{ steps.build_tag_generator.outputs.RELEASE_TAG }}
            GIT_REF=${{ github.ref }}